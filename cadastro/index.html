<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro Avellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f7f2f3; --line:#e3d4d7; --fg:#1f1416; --muted:#6b575b;
  --accent:#c4163a; --accentfg:#ffffff; --brand2:#f05a22; --ok:#1e7a3a; --okbg:#e8f5eb;
  --bad:#c4162a; --badbg:#fde8eb; --warn:#a9500c;
  --display:"Space Grotesk",system-ui,sans-serif; --text:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo img{width:40px;height:auto}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-family:var(--text);font-weight:500;font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--brand2));transition:width .3s}
.stepinfo{font-size:13px;color:var(--muted);margin-bottom:14px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;margin:6px 0 6px}
h2{font-family:var(--display);font-size:18px;margin:22px 0 8px;color:var(--fg)}
p.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(60,20,30,.06);border-radius:16px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:380px){.grid{grid-template-columns:1fr}.grid .half{grid-column:1/-1}}
.fld label.l{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.fld label.l .req{color:var(--accent)}
.fld .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.fld .err{font-size:13px;color:var(--bad);margin-top:4px;display:none}
.fld.bad .err{display:block}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--bad)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(196,22,58,.22)}
input[type=date]{min-height:50px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:11px 15px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:15px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accentfg);font-weight:600}
.chip input:focus-visible+span{box-shadow:0 0 0 3px rgba(196,22,58,.35)}
.big{display:grid;gap:10px}
.big .chip span{display:block;border-radius:14px;padding:16px;font-size:16px}
.big .chip span b{display:block;font-family:var(--display);font-size:18px}
.big .chip span em{font-style:normal;font-size:13px;color:var(--muted)}
.big .chip input:checked+span em{color:rgba(255,255,255,.88)}
.rep{border:1px dashed var(--line);border-radius:14px;padding:14px;margin:0 0 12px;background:var(--panel2)}
.rep-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:16px;border-radius:14px;padding:14px 18px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentfg)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),var(--bg) 30%);padding:22px 16px calc(16px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav .in .btn{flex:1}
.nav .in .btn.back{flex:0 0 auto}
.total{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--okbg);color:var(--ok);font-weight:600}
.doc{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin-bottom:10px}
.doc .t{font-weight:600}
.doc .t .req{color:var(--accent)}
.doc .files{display:flex;flex-direction:column;gap:6px}
.doc .file{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;background:var(--panel2);padding:8px 10px;border-radius:10px}
.doc .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc label.add{align-self:flex-start}
.doc input[type=file]{display:none}
.ok{color:var(--ok)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--panel2);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.list{margin:0;padding-left:20px} .list li{margin:4px 0}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum-row:last-child{border-bottom:0}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.consent input{width:24px;height:24px;flex:none;margin-top:2px;appearance:auto;-webkit-appearance:checkbox;accent-color:var(--accent)}
.banner{background:var(--badbg);color:var(--bad);padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
.prev{background:#fff3e6;color:var(--warn);padding:8px 12px;border-radius:10px;font-size:12.5px;margin-bottom:10px}
.center{text-align:center}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--okbg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:38px;margin:30px auto 12px}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.imv{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:14px}
.imv b{display:block;font-size:15px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
</style>
</head>

/* ---------- Parâmetros do link ---------- */
function qp(){
  var o={};
  try{ (location.search||"").replace(/^\?/,"").split("&").forEach(function(p){ if(!p) return; var a=p.split("="); o[decodeURIComponent(a[0])]=decodeURIComponent((a[1]||"").replace(/\+/g," ")); }); }catch(e){}
  return o;
}
var URLP = qp();
function boot(params){
  /* No Apps Script os parâmetros chegam por google.script.url */
  if(GAS && google.script.url){ google.script.url.getLocation(function(loc){ var p=loc.parameter||{}; Object.keys(p).forEach(function(k){URLP[k]=p[k];}); start(); }); }
  else if(API && URLP.n && !NEG){
    /* Página fora do Google: busca a negociação pelo código do link */
    app.innerHTML='<p class="lead">Carregando…</p>';
    post_({acao:"negociacao", n:URLP.n}).then(function(d){ if(d && d.id){ NEG=d; KEY=KEY+"_"+d.id; } start(); })
    .catch(function(){ app.innerHTML='<div class="banner">Não consegui abrir este link. Tente de novo em instantes ou fale com o corretor.</div>'; });
  }
  else start();
}

/* ---------- Estado ---------- */
var S = { step:0, meta:{tipo:"",papel:"",imovel:"",corretor:""}, v:{}, files:{} , attempted:{} };
function save(){ try{ var c=JSON.parse(JSON.stringify(S)); c.files={}; localStorage.setItem(KEY, JSON.stringify(c)); }catch(e){} }
function load(){ try{ var t=localStorage.getItem(KEY); if(t){ var o=JSON.parse(t); if(o&&o.v){ S.step=o.step||0; S.meta=o.meta||S.meta; S.v=o.v||{}; } } }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function get(path){ var p=path.split("."), o=S.v; for(var i=0;i<p.length;i++){ if(o==null) return ""; o=o[p[i]]; } return o==null?"":o; }
function set(path,val){ var p=path.split("."), o=S.v; for(var i=0;i<p.length-1;i++){ if(o[p[i]]==null) o[p[i]] = /^\d+$/.test(p[i+1])?[]:{}; o=o[p[i]]; } o[p[p.length-1]]=val; }

/* ---------- Máscaras e validação ---------- */
function dig(s){ return String(s||"").replace(/\D/g,""); }
var MASK = {
  cpf:function(v){ v=dig(v).slice(0,11); return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); },
  cnpj:function(v){ v=dig(v).slice(0,14); return v.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2"); },
  cep:function(v){ v=dig(v).slice(0,8); return v.replace(/(\d{5})(\d)/,"$1-$2"); },
  tel:function(v){ v=dig(v).slice(0,11); if(v.length<=10) return v.replace(/(\d{2})(\d)/,"($1) $2").replace(/(\d{4})(\d)/,"$1-$2"); return v.replace(/(\d{2})(\d)/,"($1) $2").replace(/(\d{5})(\d)/,"$1-$2"); },
  money:function(v){ v=dig(v).slice(0,12); if(!v) return ""; var n=(parseInt(v,10)/100).toFixed(2).split("."); return "R$ "+n[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+n[1]; },
  pct:function(v){ v=String(v||"").replace(/[^\d,]/g,"").slice(0,6); return v; }
};
function money2n(s){ var d=dig(s); return d?parseInt(d,10)/100:0; }
function fmtMoney(n){ return MASK.money(String(Math.round(n*100))); }
function cpfOk(c){ c=dig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false; var s=0,i,r; for(i=0;i<9;i++) s+=+c[i]*(10-i); r=(s*10)%11; if(r===10) r=0; if(r!==+c[9]) return false; s=0; for(i=0;i<10;i++) s+=+c[i]*(11-i); r=(s*10)%11; if(r===10) r=0; return r===+c[10]; }
function cnpjOk(c){ c=dig(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false; var calc=function(n){ var w=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2], s=0; for(var i=0;i<n;i++) s+=+c[i]*w[i]; var r=s%11; return r<2?0:11-r; }; return calc(12)===+c[12] && calc(13)===+c[13]; }
function emailOk(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||"").trim()); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

/* ---------- Definição dos campos ---------- */
function F(k,label,type,o){ o=o||{}; o.k=k; o.label=label; o.type=type||"text"; return o; }

function addr(p,req,extra){
  var r=!!req;
  var a=[ F(p+"cep","CEP","cep",{req:r,half:1,hint:"Preenche a rua sozinho",addr:p}),
          F(p+"uf","Estado","select",{half:1,options:UF,def:"PE"}),
          F(p+"rua","Rua, avenida, praça","text",{req:r}),

          F(p+"bairro","Bairro","text",{req:r,half:1}),
          F(p+"cidade","Cidade","text",{req:r,half:1,def:"Recife"}) ];
  return a.concat(extra||[]);
}

function fieldHTML(f, path){
  var v=get(path); if(v===""&&f.def!=null){ v=f.def; set(path,v); }
  var id="f_"+path.replace(/\./g,"_");
  var req=isReq(f)?' <span class="req">*</span>':"";
  var cls="fld "+(f.half?"half":"full");
  var h='<div class="'+cls+'" data-path="'+path+'">';
  if(f.type==="radio"){
    h+='<label class="l">'+esc(f.label)+req+'</label><div class="chips" role="radiogroup">';
    f.options.forEach(function(o,i){ h+='<label class="chip"><input type="radio" name="'+id+'" data-k="'+path+'" value="'+esc(o)+'"'+(v===o?" checked":"")+'><span>'+esc(o)+'</span></label>'; });
    h+='</div>';
  } else {
    h+='<label class="l" for="'+id+'">'+esc(f.label)+req+'</label>';
    if(f.type==="select"){
      h+='<select id="'+id+'" data-k="'+path+'"><option value="">Escolha</option>'+f.options.map(function(o){return '<option'+(v===o?" selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select>';
    } else if(f.type==="textarea"){
      h+='<textarea id="'+id+'" data-k="'+path+'" rows="3">'+esc(v)+'</textarea>';
    } else {
      var t="text", im=f.im||"", ac=f.ac||"off";
      if(f.type==="date") t="date";
      if(f.type==="email"){ t="email"; ac="email"; }
      if(f.type==="tel"){ t="tel"; im="tel"; ac="tel"; }
      if(f.type==="cpf"||f.type==="cnpj"||f.type==="cep"||f.type==="money") im="numeric";
      h+='<input id="'+id+'" type="'+t+'" data-k="'+path+'" data-m="'+f.type+'"'+(f.addr?' data-addr="'+path.replace(/cep$/,"")+'"':"")+(im?' inputmode="'+im+'"':"")+' autocomplete="'+ac+'" value="'+esc(v)+'">';
    }
  }
  if(f.hint) h+='<div class="hint">'+esc(f.hint)+'</div>';
  h+='<div class="err"></div></div>';
  return h;
}

function itemsHTML(items, base){
  var h='<div class="grid">';
  items.forEach(function(it){
    if(it.when && !it.when()) return;
    if(it.sub){ h+='<div class="full"><h2>'+esc(it.sub)+'</h2></div>'; return; }
    if(it.note){ var nt=it.note(); if(nt) h+='<div class="full note">'+esc(nt)+'</div>'; return; }

    if(it.rep){
      var arr=get(it.rep); if(!Array.isArray(arr)){ arr=[]; set(it.rep,arr); }
      var min=it.min||(it.when?1:0);
      while(arr.length<min) arr.push({});
      h+='<div class="full">';
      arr.forEach(function(o,i){
        h+='<div class="rep"><div class="rep-h"><span>'+esc(it.label)+' '+(i+1)+'</span>'+(arr.length>min?'<button class="btn sm ghost" type="button" data-del="'+it.rep+'" data-i="'+i+'">Remover</button>':"")+'</div><div class="grid">';
        it.fields.forEach(function(f){ h+=fieldHTML(f, it.rep+"."+i+"."+f.k); });
        h+='</div></div>';
      });
      if(arr.length<it.max) h+='<button class="btn sm" type="button" data-add="'+it.rep+'">+ Adicionar '+esc(it.label.toLowerCase())+'</button>';
      h+='</div>';
      return;

    h+=fieldHTML(it, it.k);
  });
  return h+'</div>';
}

function readFile(file){
  return new Promise(function(res,rej){
    if(/^image\//.test(file.type)){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        var max=1800, w=img.naturalWidth, hh=img.naturalHeight, r=Math.min(1,max/Math.max(w,hh));
        var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(hh*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        var data=c.toDataURL("image/jpeg",0.82).split(",")[1];
        res({name:file.name.replace(/\.[^.]+$/,"")+".jpg", mime:"image/jpeg", size:Math.round(data.length*0.75), data:data});
      };
      img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("Não consegui abrir esta foto. Tente tirar de novo ou mandar em PDF.")); };
      img.src=url;
    } else if(file.type==="application/pdf"){
      if(file.size>15*1024*1024){ rej(new Error("Este PDF passa de 15 MB.")); return; }
      var fr=new FileReader(); fr.onload=function(){ res({name:file.name, mime:file.type, size:file.size, data:String(fr.result).split(",")[1]}); }; fr.onerror=function(){rej(new Error("Não consegui ler o arquivo."));}; fr.readAsDataURL(file);
    } else rej(new Error("Mande foto ou PDF."));
  });
}

function visibleFields(s){
  var out=[];
  (s.items||[]).forEach(function(it){
    if(it.when && !it.when()) return;
    if(it.rep){ (get(it.rep)||[]).forEach(function(o,i){ it.fields.forEach(function(f){ out.push({f:f,path:it.rep+"."+i+"."+f.k}); }); }); return; }
    if(it.k) out.push({f:it,path:it.k});
  });
  return out;
}
function isReq(f){ return typeof f.req==="function"?f.req():!!f.req; }
function checkField(f,v){
  v=String(v==null?"":v).trim();
  if(isReq(f) && !v) return "Preencha este campo";
  if(!v) return "";
  if(f.type==="cpf" && !cpfOk(v)) return "CPF inválido, confira os números";
  if(f.type==="cnpj" && !cnpjOk(v)) return "CNPJ inválido, confira os números";
  if(f.type==="email" && !emailOk(v)) return "E-mail inválido";
  if(f.type==="tel" && dig(v).length<10) return "Coloque o DDD e o número";
  if(f.type==="cep" && dig(v).length!==8) return "CEP tem 8 números";
  if(f.type==="date"){ var y=+v.slice(0,4); if(y<1900||y>2100) return "Data inválida"; }
  return "";
}
function validate(s,show){
  var bad=0, first=null;
  visibleFields(s).forEach(function(x){
    var msg=checkField(x.f,get(x.path));
    var el=app.querySelector('[data-path="'+x.path+'"]');
    if(el && show){ el.classList.toggle("bad",!!msg); el.querySelector(".err").textContent=msg; }
    if(msg){ bad++; if(!first) first=el; }
  });
  if(show && first) first.scrollIntoView({behavior:"smooth",block:"center"});
  return bad===0;
}
function stepMissing(s){ return visibleFields(s).filter(function(x){ return !!checkField(x.f,get(x.path)); }).length; }

];
var IP="";

/* ---------- Monta o resumo legível para a ficha em PDF ---------- */
function shown(v,f){ if(v==null||v==="") return ""; if(f&&f.type==="date"){ var p=String(v).split("-"); if(p.length===3) return p[2]+"/"+p[1]+"/"+p[0]; } return String(v); }
function buildSummary(){
  var secs=[];
  secs.push({titulo:"Cadastro", linhas:[
    ["Tipo", isPF()?"Pessoa física":"Pessoa jurídica"],
    ["Preenchido como", papelTxt()],
    ["Garantia", garantiaTxt()],
    ["Fiador de", isFiador()?(S.meta.afiancado||""):""],
    ["Compõe renda ou é sócio de", isRenda()?(S.meta.afiancado||""):""],
    ["Imóvel (do link)", S.meta.imovel||""],
    ["Imóvel (informado pelo cliente)", S.meta.imovel_cliente||""],
    ["Corretor", S.meta.corretor||""]
  ].filter(function(l){return l[1];})});
  steps().forEach(function(s){
    if(s.final || s.locked) return;
    if(s.docs){
      secs.push({titulo:"Documentos", linhas: DOCS().map(function(d){ var n=(S.files[d.id]||[]).length; return [d.t, n? n+" arquivo(s)" : (d.req?"FALTANDO":"não enviado")]; })});
      return;
    }
    var linhas=[];
    (s.items||[]).forEach(function(it){
      if(it.when && !it.when()) return;
      if(it.sub){ linhas.push(["§",it.sub]); return; }
      if(it.total){ linhas.push([it.label, fmtMoney(it.total.reduce(function(a,k){return a+money2n(get(k));},0))]); return; }
      if(it.rep){ (get(it.rep)||[]).forEach(function(o,i){ var any=it.fields.some(function(f){return get(it.rep+"."+i+"."+f.k);}); if(!any) return; linhas.push(["§",it.label+" "+(i+1)]); it.fields.forEach(function(f){ var v=shown(get(it.rep+"."+i+"."+f.k),f); if(v) linhas.push([f.label,v]); }); }); return; }
      if(it.k){ var v=shown(get(it.k),it); if(v) linhas.push([it.label,v]); }
    });
    if(linhas.length) secs.push({titulo:s.title, linhas:linhas});
  });
  var nome = isPF()? get("pf.nome") : get("pj.razao");
  return {
    versao:1,
    n:NEG?NEG.id:"", garantia:S.meta.garantia||"", tipo:S.meta.tipo, papel:S.meta.papel, imovel:S.meta.imovel||S.meta.imovel_cliente||"", corretor:S.meta.corretor||"",
    nome:nome, documento: isPF()?get("pf.cpf"):get("pj.cnpj"),
    contato: isPF()? (get("pf.celular")+" · "+get("pf.email")) : (get("pj.telefone")+" · "+get("pj.email")),
    secoes:secs, termos_versao:TERMOS_VERSAO, aviso:AVISO, declaracao:DECLARACAO, dispositivo:(navigator.userAgent||'').slice(0,200), assinatura:S.meta.assinatura||"",
    aceite:{ nome:S.meta.assinatura||"", cpf:String(S.meta.aceite_cpf||"").replace(/\D/g,""), ip:IP, versao:TERMOS_VERSAO, marcadoEm:new Date().toISOString(), texto:"Li e concordo com os termos acima." },
    respostas:S.v, meta:S.meta, preenchidoEm:new Date().toISOString()
  };
}

/* ---------- Envio ---------- */
function post_(p){
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)})
    .then(function(r){ return r.json(); })
    .then(function(o){ if(!o || !o.ok) throw new Error((o&&o.erro)||"Falha no envio."); return o.dados; });
}
function run(fn){ var args=[].slice.call(arguments,1); if(!GAS) return post_({acao:fn, args:args}); return new Promise(function(res,rej){ google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e&&e.message?e:new Error(String(e)));})[fn].apply(null,args); }); }
function send(){
  var payload=buildSummary();
  var queue=[]; DOCS().forEach(function(d){ (S.files[d.id]||[]).forEach(function(f){ queue.push({doc:d.t,f:f}); }); });
  var missing=DOCS().filter(function(d){return d.req && !(S.files[d.id]||[]).length;}).map(function(d){return d.t;});
  nav.style.display="none";
  app.innerHTML='<h1>Enviando…</h1><p class="lead">Não feche esta tela.</p><div class="prog"><i id="pg"></i></div><div class="muted" id="pgt">Preparando</div>';
  var pg=document.getElementById("pg"), pgt=document.getElementById("pgt"), total=queue.length+2, done=0;
  function tick(t){ done++; pg.style.width=Math.round(done/total*100)+"%"; pgt.textContent=t; }
  if(!LIVE){
    var k=0; var iv=setInterval(function(){ k++; tick(k<total?"Enviando arquivo "+k:"Pronto"); if(k>=total){ clearInterval(iv); finish("PREVIA-0000", missing); } },350);
    return;
  }
  var token, prot;
  run("iniciarCadastro", payload).then(function(r){ token=r.token; prot=r.protocolo; tick("Ficha salva");
    return queue.reduce(function(p,q,i){ return p.then(function(){ return run("enviarArquivo", token, q.doc, q.f.name, q.f.mime, q.f.data).then(function(){ tick("Arquivo "+(i+1)+" de "+queue.length); }); }); }, Promise.resolve());
  }).then(function(){ return run("concluirCadastro", token, missing); })
  .then(function(){ tick("Pronto"); finish(prot, missing); })
  .catch(function(e){
    nav.style.display="";
    app.innerHTML='<div class="banner">Não consegui enviar: '+esc(e.message||e)+'</div><p class="lead">O que você preencheu continua guardado. Tente de novo em instantes. Se repetir, fale com o corretor.</p>';
    bNext.textContent="Tentar de novo"; bBack.style.visibility="visible";
  });
}
function finish(prot, missing){
  var cjf=(isFiador()&&casado())?get("pf.cjf.nome"):"";
  var outros=(get("pf.tem_solid")==="Sim"&&isPF()?(get("solid")||[]):isPF()?[]:(get("socios")||[])).map(function(o){return o&&o.nome;}).filter(Boolean);
  clearDraft();
  nav.style.display="none";
  app.innerHTML='<div class="done-ic">✓</div><h1 class="center">Cadastro recebido</h1><p class="lead center">Obrigado! A Avellar vai analisar e o corretor fala com você.</p>'+
    '<div class="card"><div class="sum-row"><span>Protocolo</span><b>'+esc(prot)+'</b></div></div>'+
    (missing.length?'<div class="note">Ainda falta mandar ao corretor: '+missing.map(esc).join("; ")+'.</div>':"")+
    (cjf?'<div class="note">Falta o cadastro do seu cônjuge, '+esc(cjf)+'. O corretor vai mandar o link para ele ou ela preencher como fiador.</div>':"")+
    (outros.length?'<div class="note">O corretor vai mandar um link para cada pessoa preencher o próprio cadastro: '+outros.map(esc).join("; ")+'.</div>':"");
  S={step:0,meta:{},v:{},files:{},attempted:{},sent:true};
}

/* ---------- Eventos ---------- */
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.meta){ if(t.type!=="radio"){ S.meta[t.dataset.meta]=t.value; save(); } return; }
  if(t.id==="assin"||t.id==="acpf"){ if(t.id==="assin") S.meta.assinatura=t.value; else S.meta.aceite_cpf=t.value; var f0=t.closest(".fld"); if(f0) f0.classList.remove("bad"); save(); return; }
  if(!t.dataset.k) return;
  var m=t.dataset.m;
  if(m && MASK[m]){ var pos=t.value.length; t.value=MASK[m](t.value); }
  set(t.dataset.k,t.value);
  var fl=t.closest(".fld"); if(fl && fl.classList.contains("bad")){ fl.classList.remove("bad"); }
  app.querySelectorAll("[data-total]").forEach(function(el){ el.textContent=fmtMoney(el.dataset.total.split(",").reduce(function(a,k){return a+money2n(get(k));},0)); });
  if(t.dataset.addr!=null && dig(t.value).length===8) cep(t.dataset.addr, dig(t.value));
  save();
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.meta && t.type==="radio"){ S.meta[t.dataset.meta]=t.value; if(S.meta.papel==="renda") S.meta.tipo="pf"; save(); if(S.step===0) renderStart(); return; }
  if(t.id==="consent"){ S.meta.consent=t.checked; save(); return; }
  if(t.type==="radio" && t.dataset.k){ set(t.dataset.k,t.value); save(); var y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.tagName==="SELECT" && t.dataset.k){ set(t.dataset.k,t.value); save(); return; }
  if(t.type==="file"){
    var id=t.dataset.doc, list=[].slice.call(t.files||[]);
    var y2=window.scrollY;
    Promise.all(list.map(function(f){ return readFile(f).catch(function(err){ alertBox(err.message); return null; }); })).then(function(arr){
      S.files[id]=(S.files[id]||[]).concat(arr.filter(Boolean)); render(); window.scrollTo(0,y2);
    });
  }
});
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-add],[data-del],[data-fdel],[data-go]"); if(!t) return;
  e.preventDefault();
  var y=window.scrollY;
  if(t.dataset.add){ var a=get(t.dataset.add); if(!Array.isArray(a)){a=[];set(t.dataset.add,a);} a.push({}); }
  if(t.dataset.del){ get(t.dataset.del).splice(+t.dataset.i,1); }
  if(t.dataset.fdel){ S.files[t.dataset.fdel].splice(+t.dataset.i,1); }
  if(t.dataset.go){ S.step=+t.dataset.go; render(); return; }
  render(); window.scrollTo(0,y);
});
function alertBox(msg){ var d=document.createElement("div"); d.className="banner"; d.textContent=msg; app.prepend(d); window.scrollTo(0,0); setTimeout(function(){d.remove();},6000); }

function cep(prefix, c){
  try{
    fetch("https://viacep.com.br/ws/"+c+"/json/").then(function(r){return r.json();}).then(function(j){
      if(!j || j.erro) return;
      var map={rua:j.logradouro,bairro:j.bairro,cidade:j.localidade,uf:j.uf};
      Object.keys(map).forEach(function(k){ if(!map[k]) return; set(prefix+k,map[k]); var el=app.querySelector('[data-k="'+prefix+k+'"]'); if(el) el.value=map[k]; });
      var n=app.querySelector('[data-k="'+prefix+'numero"]'); if(n && !n.value) n.focus();
      save();
    }).catch(function(){});
  }catch(e){}
}

bBack.addEventListener("click",function(){ if(S.step>0){ S.step--; render(); } });
bNext.addEventListener("click",function(){
  if(S.step===0){
    var ok=true;
    app.querySelectorAll(".card .fld").forEach(function(fl,i){
      var need = i===0 ? !S.meta.tipo : i===1 ? !S.meta.papel : (fl.dataset.path==="__afianca" && !String(S.meta.afiancado||"").trim());
      fl.classList.toggle("bad",!!need); if(need) ok=false;
    });
    if(!ok) return;
    S.started=true; S.step=1; render(); return;
  }
  var st=steps(), s=st[S.step-1];
  if(!s){ S.step=0; render(); return; }
  if(s.final){
    var c=document.getElementById("consent"), a=document.getElementById("assin");
    var fc=app.querySelector('[data-path="__consent"]'), fa=app.querySelector('[data-path="__assin"]');
    var cp=document.getElementById("acpf"), fp=app.querySelector('[data-path="__acpf"]');
    var okc=c&&c.checked, oka=a && a.value.trim().split(/\s+/).length>=2, okp=cp && String(cp.value).replace(/\D/g,"").length===11;
    if(fc) fc.classList.toggle("bad",!okc); if(fa) fa.classList.toggle("bad",!oka); if(fp) fp.classList.toggle("bad",!okp);
    if(!okc||!oka||!okp) return;
    S.meta.assinatura=a.value.trim(); S.meta.aceite_cpf=cp.value; S.meta.consent=true;
    var blocking=st.filter(function(x){return !x.final && !x.docs && stepMissing(x)>0;});
    if(blocking.length){ var idx=st.indexOf(blocking[0]); S.attempted[blocking[0].id]=true; S.step=idx+1; render(); alertBox("Falta preencher alguns campos obrigatórios nesta etapa."); return; }
    send(); return;
  }
  S.attempted[s.id]=true;
  if(!s.docs && !validate(s,true)) return;
  S.step++; render();
});

function start(){
  load();
  if(URLP.imovel) S.meta.imovel=URLP.imovel;
  if(NEG){ S.meta.imovel=NEG.imovel_nome; S.meta.corretor=NEG.corretor; if(NEG.tipo) S.meta.tipo=S.meta.tipo||NEG.tipo; }
  if(URLP.corretor) S.meta.corretor=URLP.corretor;
  if(URLP.tipo==="pf"||URLP.tipo==="pj") S.meta.tipo = S.meta.tipo || URLP.tipo;
  if(URLP.papel==="locatario"||URLP.papel==="fiador"||URLP.papel==="renda") S.meta.papel = S.meta.papel || URLP.papel;
  if(S.meta.papel==="renda") S.meta.tipo="pf";
  if(URLP.g==="seguro"||URLP.g==="fiador") S.meta.garantia=URLP.g;
  if(NEG && (NEG.garantia==="seguro"||NEG.garantia==="fiador")) S.meta.garantia=NEG.garantia;
  if(isSeguro() && S.meta.papel==="fiador") S.meta.papel="";
  if(S.step>0 && !S.meta.tipo) S.step=0;
  render();
}
boot();
})();

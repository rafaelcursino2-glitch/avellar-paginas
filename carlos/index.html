<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Painel Carlos">
<meta name="theme-color" content="#c4163a">
<meta name="robots" content="noindex">
<title>Painel do Carlos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f7f2f3; --line:#e3d4d7; --fg:#1f1416; --muted:#6b575b;
  --accent:#c4163a; --accentfg:#ffffff; --brand2:#f05a22; --ok:#1e7a3a; --okbg:#e8f5eb;
  --bad:#c4162a; --badbg:#fde8eb; --warn:#a9500c; --warnbg:#fdf0e3; --wa:#1f8f4e;
  --display:"Space Grotesk",system-ui,sans-serif; --text:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px 100px}
header.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo img{width:40px;height:auto}
.brand{font-family:var(--display);font-weight:700;font-size:20px;flex:1;min-width:0}
.brand small{display:block;font-family:var(--text);font-weight:500;font-size:12.5px;color:var(--muted)}
button{font:inherit;cursor:pointer}
.ico{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:22px;height:22px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:15px;color:var(--fg);white-space:nowrap}
.tab b{font-weight:600;margin-left:4px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accentfg)}
.busca{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;outline:none;background:var(--bg);color:var(--fg)}
.busca:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(196,22,58,.2)}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(60,20,30,.06);border-radius:16px;padding:14px;margin:0 0 12px}
.card.alerta{border-left:5px solid var(--accent)}
.card.leve{border-left:5px solid var(--brand2)}
.l1{display:flex;align-items:flex-start;gap:10px}
.nome{font-family:var(--display);font-weight:600;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.etapa{flex:none;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.etapa.AG{background:var(--badbg);color:var(--bad)}
.etapa.VA,.etapa.VR{background:#e8eefc;color:#2446a8}
.etapa.NE{background:var(--okbg);color:var(--ok)}
.imovel{margin:4px 0 2px;font-size:15px}
.imovel span{color:var(--muted);font-size:13px}
.meta{font-size:13.5px;color:var(--muted)}
.meta .q{color:var(--bad);font-weight:600}
.meta .m{color:var(--warn);font-weight:600}
.ult{margin-top:8px;font-size:14px;background:var(--panel2);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.ult small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentfg)}
.btn.wa{color:var(--wa);border-color:#bfe2cc}
.btn svg{width:18px;height:18px}
.vazio,.erro,.carregando{text-align:center;color:var(--muted);padding:40px 10px}
.erro{color:var(--bad)}
/* folha de baixo */
.fundo{position:fixed;inset:0;background:rgba(20,8,12,.45);display:none;z-index:10}
.folha{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .2s;z-index:11;max-width:620px;margin:0 auto}
.aberta .fundo{display:block}
.aberta .folha{transform:none}
.folha h2{font-family:var(--display);font-size:20px;margin:0 0 2px}
.folha .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{padding:10px 13px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:15px;color:var(--fg)}
.rot{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
textarea{width:100%;font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;min-height:150px;resize:vertical}
.dica{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:8px 0 12px}
.mic{width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;flex:none}
.mic svg{width:26px;height:26px}
.mic.ouvindo{background:var(--brand2);animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 10px rgba(240,90,34,.2)}}
.linha{display:flex;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;display:none;max-width:90vw;text-align:center}
.pronto{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
/* ===== Modo guiado (Carlos) ===== */
#guia{max-width:620px;margin:0 auto;padding:12px 16px 40px;font-size:20px}
body.lista #guia{display:none}
body:not(.lista) .wrap{display:none}
#guia .topo{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
#guia .topo .brand{font-size:20px}
#guia h1{font-family:var(--display);font-size:30px;line-height:1.2;margin:18px 0 10px}
#guia p{font-size:20px;color:var(--fg);margin:0 0 18px}
#guia .muted{color:var(--muted);font-size:17px}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border-radius:18px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:21px;font-weight:600;margin:0 0 12px;padding:12px 16px;text-decoration:none;cursor:pointer;text-align:center}
.g-btn svg{width:28px;height:28px;flex:none}
.g-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.g-btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.g-btn.ok{background:#1e7a3a;border-color:#1e7a3a;color:#fff}
.g-btn.pq{min-height:52px;font-size:17px;font-weight:500;color:var(--muted);border-style:dashed}
.g-opc{border-left-width:10px}
.g-opc.c1{border-left-color:#8a8a8a}.g-opc.c2{border-left-color:#2446a8}.g-opc.c3{border-left-color:#7a3db8}
.g-opc.c4{border-left-color:#1e7a3a}.g-opc.c5{border-left-color:#f05a22}.g-opc.c6{border-left-color:#c4162a}.g-opc.c7{border-left-color:#b8860b}
.g-cli{background:var(--panel2);border-radius:20px;padding:18px;margin:0 0 16px}
.g-cli .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.g-cli .i{font-size:20px;margin-top:6px}
.g-cli .s{display:inline-block;margin-top:10px;font-size:18px;font-weight:600;padding:6px 12px;border-radius:99px;background:#fff;color:var(--accent)}
.g-cli .u{margin-top:10px;font-size:17px;color:var(--muted)}
.g-pos{font-size:17px;color:var(--muted);margin:0 0 8px}
.g-q{font-family:var(--display);font-size:26px;font-weight:700;margin:6px 0 14px}
.g-mic{width:120px;height:120px;border-radius:50%;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:8px auto 10px;cursor:pointer}
.g-mic svg{width:54px;height:54px}
.g-mic.ouvindo{background:#f05a22;animation:pulsa 1.2s infinite}
.g-micT{text-align:center;font-size:18px;color:var(--muted);margin-bottom:12px}
#g-txt{width:100%;font:inherit;font-size:21px;min-height:120px;border:2px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
.g-salvo{position:fixed;inset:0;background:#1e7a3a;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;font-family:var(--display);font-size:40px;font-weight:700;text-align:center;padding:20px}
.g-salvo svg{width:120px;height:120px;margin-bottom:10px}
.g-salvo small{display:block;font-family:var(--text);font-size:20px;font-weight:500;margin-top:10px}
.voltaSimples{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;border-radius:16px;border:2px solid var(--accent);background:var(--accent);color:#fff;font-size:19px;font-weight:600;margin:0 0 12px}
</style>
</head>

<script>
var ETAPA = {'Aguardando Atendimento':'AG','Pré-atendimento':'PR','Em Atendimento':'EA','Visita Agendada':'VA','Visita Realizada':'VR','Negociação':'NE'};
var MARCAS = ['Falei com o cliente','Não atende','Não responde às mensagens','Marcou visita','Visitou','Fez proposta','Vai mandar cadastro','Desistiu','Alugou ou comprou outro','Sem perfil ou sem renda','Queria outra coisa'];
var D = null, filtro = 'novos', marca = '', atual = null;

var IC = {
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  fala:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>'
};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function toast(t,ms){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},ms||3000);}
function dias(iso){return Math.floor((Date.now()-new Date(iso).getTime())/864e5);}
function dataBR(iso){var d=new Date(iso);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);}
function horaBR(iso){var d=new Date(iso);return ('0'+d.getHours()).slice(-2)+'h'+('0'+d.getMinutes()).slice(-2);}
function nomeImovel(l){if(!l.imoveis.length)return'<span>sem imóvel no lead</span>';return l.imoveis.map(function(i){return i.n?esc(i.n)+' <span>· '+esc(i.c)+'</span>':esc(i.c)+' <span>· nome a conferir</span>';}).join('<br>');}
// Andamento = último retorno do Carlos. A data de alteração do CRM não serve: muda quando o sistema ou os agentes gravam.
function temRet(l){return !!(l.ultimo&&l.ultimo.quando&&!/ignorar|teste/i.test(l.ultimo.lancado||''));}
function ultimoMov(l){return temRet(l)?l.ultimo.quando:l.criado;}
function parado(l){return dias(ultimoMov(l));}
function cod(l){return ETAPA[l.status]||'';}
function precisa(l){var c=cod(l);if(c==='AG')return true;
  if(!temRet(l))return c==='PR'?parado(l)>=3:true;
  if(c==='VA'||c==='VR')return parado(l)>=2;return parado(l)>=3;}
function primeiro(n){n=String(n||'').trim().split(/\s+/)[0]||'';return n?n.charAt(0).toUpperCase()+n.slice(1).toLowerCase():'cliente';}
function telWa(t){t=String(t||'').replace(/\D/g,'');if(!t)return'';if(t.length<=11)t='55'+t;return t;}

var API='https://script.google.com/macros/s/AKfycbyPbE5XsBfWM4k9WuX5HRf2aYE2LFf-7Mk5S919KII9s89UMrUHjhiAkJulVOrTZXpWhg/exec';
(function(){var k=new URLSearchParams(location.search).get('k');try{if(k)localStorage.setItem('painelCarlosK',k);else k=localStorage.getItem('painelCarlosK');}catch(e){}window.K=k||'';})();
function chama(fn){var a=[].slice.call(arguments,1),p;
  if(fn==='carregar')p={acao:'carregar',k:a[0],forcar:!!a[1]};
  else if(fn==='salvarRetorno')p={acao:'salvar',k:a[0],lead:a[1],texto:a[2],marca:a[3],etapa:a[4],r:a[5]||null};
  else p={acao:'cadastro',k:a[0],lead:a[1],link:a[2]};
  if(!p.k)return Promise.reject(new Error('Abra pelo link do Carlos.'));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
    .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.erro||'Erro');return j.dados;});}

function guardado(){try{var x=JSON.parse(localStorage.getItem('painelCarlos')||'null');return x&&x.leads?x:null;}catch(e){return null;}}
function guarda(d){try{localStorage.setItem('painelCarlos',JSON.stringify(d));}catch(e){}}
function carregar(forcar){
  if(!D){var g=guardado();if(g){D=g;desenha();}}
  $('hora').textContent='Atualizando…';
  chama('carregar',window.K,!!forcar).then(function(d){D=d;guarda(d);$('hora').textContent='Atualizado às '+horaBR(d.agora);desenha();})
  .catch(function(e){$('hora').textContent='Sem conexão com o CRM';if(!D)$('lista').innerHTML='<div class="erro">'+esc(e.message||e)+'</div>';else toast('Não consegui atualizar agora. Mostrando a última lista.',4000);});
}

function grupos(){
  var L=D.leads.filter(precisa);
  function de(cs){return L.filter(function(l){return cs.indexOf(cod(l))>=0;});}
  return [
    ['novos','Novos',de(['AG'])],
    ['pre','Pré-atendimento',de(['PR'])],
    ['em','Em atendimento',de(['EA'])],
    ['visitas','Visitas',de(['VA','VR'])],
    ['neg','Negociação',de(['NE'])]
  ];
}

function desenha(){
  if(!D)return;
  var G=grupos();
  $('tabs').innerHTML=G.map(function(g){return '<button class="tab'+(g[0]===filtro?' on':'')+'" data-f="'+g[0]+'">'+g[1]+'<b>'+g[2].length+'</b></button>';}).join('');
  var lista=G.filter(function(g){return g[0]===filtro;})[0][2].slice();
  var q=$('busca').value.trim().toLowerCase();
  if(q)lista=D.leads.filter(function(l){return (l.nome+' '+l.imoveis.map(function(i){return i.c+' '+i.n;}).join(' ')).toLowerCase().indexOf(q)>=0;});
  lista.sort(function(a,b){var x=cod(a)==='AG',y=cod(b)==='AG';if(x!==y)return x?-1:1;return parado(b)-parado(a);});
  if(!lista.length){$('lista').innerHTML='<div class="vazio">'+(q?'Nada encontrado.':'Nenhum lead parado nesta etapa. Tudo em dia.')+'</div>';return;}
  $('lista').innerHTML=lista.map(cartao).join('');
}

function cartao(l){
  var p=parado(l),c=cod(l),cls=c==='AG'||p>7?'alerta':(p>=3?'leve':'');
  var meta='Entrou '+dataBR(l.criado)+' · ';
  if(c==='AG')meta+='<span class="q">sem primeiro contato</span>';
  else if(p===0&&temRet(l))meta+='retorno dado hoje';
  else if(!temRet(l))meta+='<span class="'+(p>7?'q':'m')+'">ainda sem retorno do corretor</span>';
  else meta+='<span class="'+(p>7?'q':p>=3?'m':'')+'">último retorno há '+p+(p===1?' dia':' dias')+'</span>';
  var ult='';
  if(l.ultimo){ult='<div class="ult"><small>Seu último retorno · '+dataBR(l.ultimo.quando)+(l.ultimo.marca?' · '+esc(l.ultimo.marca):'')+'</small>'+esc(l.ultimo.texto||'')+'</div>';}
  var wa=telWa(l.tel);
  return '<div class="card '+cls+'">'+
    '<div class="l1"><div class="nome">'+esc(l.nome||'Sem nome')+'</div><div class="etapa '+c+'">'+esc(l.status)+'</div></div>'+
    '<div class="imovel">'+nomeImovel(l)+'</div>'+
    '<div class="meta">'+meta+(l.negocio?' · '+esc(l.negocio):'')+'</div>'+ult+
    '<div class="acoes">'+
      '<button class="btn pri" data-r="'+esc(l.id)+'">'+IC.fala+' Dar retorno</button>'+
      (wa?'<a class="btn wa" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">'+IC.wa+' WhatsApp</a>':'')+
      (l.cad||l.negocio==='Locação'?'<button class="btn" data-c="'+esc(l.id)+'">'+IC.doc+' Enviar cadastro</button>':'')+
    '</div></div>';
}

function lead(id){return D.leads.filter(function(l){return l.id===id;})[0];}
function abre(html){$('folha').innerHTML=html;document.body.classList.add('aberta');}
function fecha(){parar();document.body.classList.remove('aberta');atual=null;}

/* ---- Retorno ---- */
var rec=null,ouvindo=false,baseTexto='';
var DESTINOS=[['EA','Em atendimento'],['VA','Visita agendada'],['VR','Visita realizada'],['NE','Negociação'],['FE','Fechou'],['IN','Inativar (desistiu)']];
var SUGERE={'Falei com o cliente':'EA','Marcou visita':'VA','Visitou':'VR','Fez proposta':'NE','Desistiu':'IN','Alugou ou comprou outro':'IN','Sem perfil ou sem renda':'IN','Queria outra coisa':'IN'};
var etapa='';
function marcaEtapa(e){etapa=e;[].forEach.call(document.querySelectorAll('[data-e]'),function(c){c.classList.toggle('on',c.dataset.e===etapa);});
  var d=$('dicaEtapa');if(d)d.textContent=etapa==='VA'?'Diga no texto o dia e a hora da visita.':etapa==='IN'?'Diga no texto o motivo.':etapa==='NE'?'Diga no texto o valor ou a proposta.':'';}
function abreRetorno(id){
  atual=lead(id);marca='';etapa='';
  var c=cod(atual),ordem=['AG','PR','EA','VA','VR','NE'],pos=ordem.indexOf(c);
  var dest=DESTINOS.filter(function(d){var i=ordem.indexOf(d[0]);return d[0]!==c&&(i<0||i>pos);});
  abre('<h2>'+esc(atual.nome)+'</h2><div class="sub">'+nomeImovel(atual).replace(/<br>/g,' · ')+'</div>'+
    '<div class="chips">'+MARCAS.map(function(m){return '<button class="chip" data-m="'+esc(m)+'">'+esc(m)+'</button>';}).join('')+'</div>'+
    '<div class="rot">Etapa no CRM</div><div class="chips"><button class="chip on" data-e="">Continua em '+esc(atual.status)+'</button>'+
      dest.map(function(d){return '<button class="chip" data-e="'+d[0]+'">'+esc(d[1])+'</button>';}).join('')+'</div><div class="dica" id="dicaEtapa"></div>'+
    '<textarea id="texto" placeholder="Conte como está: falou com o cliente? O que ele disse? Marcou visita? Para quando?"></textarea>'+
    '<div class="dica"><button class="mic" id="mic" aria-label="Falar">'+IC.mic+'</button><span id="dicaTxt">Para falar em vez de digitar, toque no microfone do teclado do celular.</span></div>'+
    '<div class="linha"><button class="btn" id="cancelar">Cancelar</button><button class="btn pri" id="salvar">Salvar em '+esc(primeiro(atual.nome))+'</button></div>');
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){$('mic').style.display='flex';$('dicaTxt').textContent='Toque no botão vermelho e fale. Ou use o microfone do teclado.';}
}
function falar(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(ouvindo){parar();return;}
  try{
    rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
    baseTexto=$('texto').value;if(baseTexto&&!/\s$/.test(baseTexto))baseTexto+=' ';
    rec.onresult=function(ev){var fim='',parcial='';for(var i=0;i<ev.results.length;i++){if(ev.results[i].isFinal)fim+=ev.results[i][0].transcript;else parcial+=ev.results[i][0].transcript;}$('texto').value=baseTexto+fim+parcial;};
    rec.onerror=function(ev){parar();if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){$('mic').style.display='none';$('dicaTxt').textContent='Use o microfone do teclado do celular para falar.';}};
    rec.onend=function(){ouvindo=false;var m=$('mic');if(m)m.classList.remove('ouvindo');};
    rec.start();ouvindo=true;$('mic').classList.add('ouvindo');
  }catch(e){$('mic').style.display='none';$('dicaTxt').textContent='Use o microfone do teclado do celular para falar.';}
}
function parar(){if(rec){try{rec.stop();}catch(e){}}ouvindo=false;var m=$('mic');if(m)m.classList.remove('ouvindo');}
function salvar(){
  parar();
  var t=$('texto').value.trim();
  if(!t&&!marca){toast('Fale ou escreva o retorno antes de salvar.');return;}
  var b=$('salvar');b.disabled=true;b.textContent='Salvando…';
  var l=atual;
  var et=etapa;
  chama('salvarRetorno',window.K,l.id,t,marca,et).then(function(r){
    l.ultimo={quando:r.quando,tipo:'RETORNO',marca:marca,texto:t,lancado:'PENDENTE'};
    fecha();guarda(D);desenha();toast(et?'Retorno salvo. O sistema muda a etapa no CRM.':'Retorno salvo. O sistema lança no CRM.');
  }).catch(function(e){b.disabled=false;b.textContent='Salvar em '+primeiro(l.nome);toast('Não salvou: '+(e.message||e),5000);});
}

/* ---- Cadastro ---- */
function abreCadastro(id){
  atual=lead(id);
  var im=atual.imoveis[0]||{c:'',n:''};
  var nomeIm=im.n||im.c||'';
  var link=atual.cad?D.form+'?n='+encodeURIComponent(atual.cad):D.form+'?imovel='+encodeURIComponent(nomeIm)+'&corretor='+encodeURIComponent(D.corretor);
  var msg='Olá, '+primeiro(atual.nome)+'! Aqui é o Carlos, da Avellar Imóveis. Para seguirmos com a locação'+(nomeIm?' do imóvel '+nomeIm:'')+', preencha o cadastro pelo celular neste link: '+link+'\nQualquer dúvida, estou à disposição.';
  var wa=telWa(atual.tel);
  abre('<h2>Enviar cadastro</h2><div class="sub">'+esc(atual.nome)+' · '+esc(nomeIm||'sem imóvel no lead')+'</div>'+
    (atual.cad?'<div class="dica">Link com os valores da negociação lançada no CRM.</div>':'<div class="dica">Ainda sem negociação lançada: o cliente preenche sem os valores.</div>')+'<textarea id="msg">'+esc(msg)+'</textarea>'+
    '<div class="dica">Confira a mensagem. Ao tocar no botão, o WhatsApp abre com ela pronta. É só enviar.</div>'+
    '<div class="linha"><button class="btn" id="cancelar">Cancelar</button>'+
    (wa?'<a class="btn pri" id="enviarWa" href="#" target="_blank" rel="noopener">'+IC.wa+' Abrir WhatsApp</a>':'<button class="btn pri" id="copiar">Copiar mensagem</button>')+'</div>'+
    (wa?'':'<div class="dica">Esse lead está sem telefone no CRM.</div>'));
  if(wa){$('enviarWa').addEventListener('click',function(){
    this.href='https://wa.me/'+wa+'?text='+encodeURIComponent($('msg').value);
    var l=atual;
    chama('registrarCadastro',window.K,l.id,link).then(function(r){l.ultimo={quando:r.quando,tipo:'CADASTRO ENVIADO',marca:'Link do cadastro',texto:'Cadastro enviado pelo WhatsApp.'};desenha();}).catch(function(){});
    setTimeout(fecha,300);
  });}
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.f){filtro=t.dataset.f;$('busca').value='';desenha();window.scrollTo(0,0);}
  else if(t.dataset.r)gAtender(t.dataset.r);
  else if(t.dataset.c)abreCadastro(t.dataset.c);
  else if(t.dataset.m!==undefined){marca=marca===t.dataset.m?'':t.dataset.m;[].forEach.call(document.querySelectorAll('[data-m]'),function(c){c.classList.toggle('on',c.dataset.m===marca);});
    var s=SUGERE[marca];if(s&&document.querySelector('[data-e="'+s+'"]'))marcaEtapa(s);}
  else if(t.dataset.e!==undefined)marcaEtapa(t.dataset.e);
  else if(t.id==='mic')falar();
  else if(t.id==='salvar')salvar();
  else if(t.id==='cancelar')fecha();
  else if(t.id==='atualizar')carregar(true);
  else if(t.id==='copiar'){var m=$('msg');m.select();try{navigator.clipboard.writeText(m.value);}catch(x){document.execCommand('copy');}toast('Mensagem copiada.');}
});
$('fundo').addEventListener('click',fecha);
$('busca').addEventListener('input',desenha);
/* ===== Modo guiado: um cliente por vez, botões grandes ===== */
var G={fila:[],i:0,op:null,iniciado:false};
var SITUACAO={AG:'Ainda não foi contatado',PR:'Ainda não respondeu',EA:'Conversando',VA:'Visita marcada',VR:'Já visitou',NE:'Em negociação'};
var OPCOES=[
  {id:'nr',t:'Não respondeu',c:'c1',marca:'Não responde às mensagens',etapa:''},
  {id:'int',t:'Conversamos, segue interessado',c:'c2',marca:'Falei com o cliente',etapa:'EA',perg:['interesse','trava','passo']},
  {id:'vis',t:'Marcou visita',c:'c3',marca:'Marcou visita',etapa:'VA',perg:['interesse','trava'],passo:'Fazer a visita',q:'Que dia e que hora é a visita?',obrig:true},
  {id:'vtu',t:'Visitou',c:'c4',marca:'Visitou',etapa:'VR',perg:['interesse','trava','passo']},
  {id:'pro',t:'Fez proposta',c:'c5',marca:'Fez proposta',etapa:'NE',perg:['interesse','trava','passo'],q:'Qual o valor e as condições da proposta?',obrig:true},
  {id:'fec',t:'Fechou negócio',c:'c7',marca:'Fechou negócio',etapa:'FE',so:['NE']},
  {id:'des',t:'Desistiu',c:'c6',marca:'Desistiu',etapa:'IN',motivo:true}
];
var MOTIVOS=[['Alugou ou comprou outro','Alugou ou comprou outro'],['Sem renda ou sem perfil','Sem perfil ou sem renda'],['Queria outro tipo de imóvel','Queria outra coisa'],['Outro motivo','Desistiu']];
var PERG={interesse:['Qual o interesse do cliente?',[['Muito','c4'],['Médio','c5'],['Pouco','c1']]],
  trava:['O que está travando?',[['Preço','c6'],['Localização','c2'],['Tamanho do imóvel','c3'],['Fiador ou documentos','c5'],['Ver com a família','c7'],['Nada, está tudo certo','c4']]],
  passo:['Qual o próximo passo?',[['Ligar de novo','c2'],['Marcar visita','c3'],['Mandar outras opções','c5'],['Esperar o cliente','c1']]]};
var ORDEM=['AG','PR','EA','VA','VR','NE'],PRIO={AG:0,NE:1,VR:2,VA:3,EA:4,PR:5};
function gEl(){return document.getElementById('guia');}
function gTopo(){return '<div class="topo"><div class="logo"><img alt="Avellar" src="'+document.querySelector('.logo img').src+'"></div><div class="brand">Avellar Imóveis<small>Painel do Carlos</small></div></div>';}
function gSaud(){var h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
function gMontaFila(){G.fila=D.leads.filter(precisa).sort(function(a,b){var x=PRIO[cod(a)],y=PRIO[cod(b)];if(x!==y)return x-y;return parado(b)-parado(a);});G.i=0;}
function gInicio(){
  if(!D){gEl().innerHTML=gTopo()+'<h1>Carregando seus clientes…</h1><p class="muted">Só um momento.</p>';return;}
  gMontaFila();var n=G.fila.length;
  gEl().innerHTML=gTopo()+'<h1>'+gSaud()+', Carlos.</h1>'+
    (n?'<p>Hoje são <b>'+n+'</b> '+(n===1?'cliente':'clientes')+' para dar notícia.</p><button class="g-btn pri" data-g="comecar">Começar</button>'
      :'<p>Todos os seus clientes estão em dia. Obrigado!</p>')+
    '<button class="g-btn pq" data-g="lista">Ver a lista completa</button>';
}
function gLista(){G.solo=false;document.body.classList.add('lista');desenha();window.scrollTo(0,0);}
function gAtender(id){G.fila=D.leads.filter(function(l){return String(l.id)===String(id);}).slice(0,1);G.i=0;G.solo=true;document.body.classList.remove('lista');gCliente();}
function gCliente(){
  var l=G.fila[G.i];if(!l){gFim();return;}
  var c=cod(l),im=l.imoveis[0],wa=telWa(l.tel);
  var opc=OPCOES.filter(function(o){if(o.so&&o.so.indexOf(c)<0)return false;if(o.etapa&&o.etapa!=='IN'&&o.etapa!=='FE'&&ORDEM.indexOf(o.etapa)<=ORDEM.indexOf(c)&&o.id!=='int'&&o.id!=='vtu')return false;return true;});
  gEl().innerHTML=gTopo()+(G.solo?'':'<div class="g-pos">Cliente '+(G.i+1)+' de '+G.fila.length+'</div>')+
    '<div class="g-cli"><div class="n">'+esc(l.nome||'Sem nome')+'</div><div class="i">'+(im?esc(im.n||im.c):'Sem imóvel')+'</div><div class="s">'+esc(SITUACAO[c]||l.status)+'</div>'+
    (temRet(l)?'<div class="u">Sua última notícia: '+esc(l.ultimo.texto||l.ultimo.marca||'')+'</div>':'')+'</div>'+
    (wa?'<a class="g-btn wa" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">'+IC.wa+' Chamar no WhatsApp</a>':'')+
    '<div class="g-q">O que aconteceu?</div>'+
    opc.map(function(o){return '<button class="g-btn g-opc '+o.c+'" data-g="op" data-o="'+o.id+'">'+esc(o.t)+'</button>';}).join('')+
    (l.cad||l.negocio==='Locação'?'<button class="g-btn" data-g="cad">'+IC.doc+' Mandar a ficha de cadastro</button>':'')+
    '<button class="g-btn pq" data-g="pular">'+(G.solo?'Voltar para a lista':'Deixar para depois')+'</button>';
  window.scrollTo(0,0);
}
function gOpcao(id){
  var o=OPCOES.filter(function(x){return x.id===id;})[0];G.op={o:o,marca:o.marca,r:{passo:o.passo||''},k:0};
  if(o.motivo){gEl().innerHTML=gTopo()+'<div class="g-q">Por que desistiu?</div>'+MOTIVOS.map(function(m,i){return '<button class="g-btn g-opc c6" data-g="mot" data-i="'+i+'">'+esc(m[0])+'</button>';}).join('')+'<button class="g-btn pq" data-g="voltar">Voltar</button>';return;}
  if(o.id==='nr'){gSalvar('');return;}
  gProx();
}
function gProx(){
  var o=G.op.o,p=(o.perg||[])[G.op.k];
  if(p){var P=PERG[p];gEl().innerHTML=gTopo()+'<div class="g-pos">Pergunta '+(G.op.k+1)+' de '+o.perg.length+'</div><div class="g-q">'+esc(P[0])+'</div>'+
    P[1].map(function(x,i){return '<button class="g-btn g-opc '+x[1]+'" data-g="resp" data-p="'+p+'" data-i="'+i+'">'+esc(x[0])+'</button>';}).join('')+
    '<button class="g-btn pq" data-g="voltar">Voltar</button>';window.scrollTo(0,0);return;}
  if(o.q)gPergunta(o.q,o.obrig);else gPergunta('Quer contar mais? Fale aqui.',false);
}
function gPergunta(q,obrig){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  gEl().innerHTML=gTopo()+'<div class="g-q">'+esc(q)+'</div>'+
    (SR?'<button class="g-mic" id="gMic" data-g="mic" aria-label="Falar">'+IC.mic+'</button><div class="g-micT" id="gMicT">Toque no microfone e fale</div>':'<div class="g-micT">Toque no microfone do teclado para falar</div>')+
    '<textarea id="g-txt" placeholder="Ou escreva aqui"></textarea>'+
    '<button class="g-btn ok" data-g="salvar">Salvar</button>'+
    (obrig?'':'<button class="g-btn pq" data-g="semtexto">Salvar sem falar nada</button>')+
    '<button class="g-btn pq" data-g="voltar">Voltar</button>';
  G.obrig=!!obrig;
}
var gRec=null,gOuv=false;
function gFalar(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=document.getElementById('gMic'),t=document.getElementById('gMicT'),ta=document.getElementById('g-txt');
  if(gOuv){try{gRec.stop();}catch(e){}return;}
  try{gRec=new SR();gRec.lang='pt-BR';gRec.continuous=true;gRec.interimResults=true;var base=ta.value?ta.value+' ':'';
    gRec.onresult=function(ev){var s='';for(var i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;ta.value=base+s;};
    gRec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){b.style.display='none';t.textContent='Toque no microfone do teclado para falar';}};
    gRec.onend=function(){gOuv=false;b.classList.remove('ouvindo');t.textContent='Toque no microfone e fale';};
    gRec.start();gOuv=true;b.classList.add('ouvindo');t.textContent='Estou ouvindo… toque de novo para parar';
  }catch(e){b.style.display='none';t.textContent='Toque no microfone do teclado para falar';}
}
function gSalvar(texto){
  if(gOuv&&gRec){try{gRec.stop();}catch(e){}}
  var l=G.fila[G.i],o=G.op.o,c=cod(l);
  var et=o.etapa&&(o.etapa==='IN'||o.etapa==='FE'||ORDEM.indexOf(o.etapa)>ORDEM.indexOf(c))?o.etapa:'';
  var b=document.querySelector('[data-g="salvar"]');if(b){b.disabled=true;b.textContent='Salvando…';}
  chama('salvarRetorno',window.K,l.id,texto,G.op.marca,et,G.op.r).then(function(r){
    l.ultimo={quando:r.quando,tipo:'RETORNO',marca:G.op.marca,texto:texto,lancado:'PENDENTE'};guarda(D);
    var s=document.getElementById('gSalvo');s.style.display='flex';
    setTimeout(function(){s.style.display='none';if(G.solo)gLista();else{G.i++;gCliente();}},1600);
  }).catch(function(e){if(b){b.disabled=false;b.textContent='Salvar';}toast('Não salvou. Tente de novo. ('+(e.message||e)+')',6000);});
}
function gFim(){gEl().innerHTML=gTopo()+'<h1>Pronto, Carlos!</h1><p>Você deu notícia de todos os clientes de hoje. Obrigado!</p><button class="g-btn pq" data-g="inicio">Voltar ao início</button><button class="g-btn pq" data-g="lista">Ver a lista completa</button>';}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-g]');if(!t)return;var a=t.dataset.g;
  if(a==='comecar'){G.iniciado=true;gMontaFila();gCliente();}
  else if(a==='op')gOpcao(t.dataset.o);
  else if(a==='mot'){var m=MOTIVOS[+t.dataset.i];G.op.marca=m[1];gPergunta('Quer contar mais? Fale aqui.',false);}
  else if(a==='resp'){G.op.r[t.dataset.p]=PERG[t.dataset.p][1][+t.dataset.i][0];G.op.k++;gProx();}
  else if(a==='mic')gFalar();
  else if(a==='salvar'){var v=(document.getElementById('g-txt').value||'').trim();if(G.obrig&&!v){toast('Fale ou escreva a resposta antes de salvar.',4000);return;}gSalvar(v);}
  else if(a==='semtexto')gSalvar('');
  else if(a==='voltar')gCliente();
  else if(a==='pular'){if(G.solo)gLista();else{G.i++;gCliente();}}
  else if(a==='cad')abreCadastro(G.fila[G.i].id);
  else if(a==='lista'){document.body.classList.add('lista');desenha();window.scrollTo(0,0);}
  else if(a==='simples'){document.body.classList.remove('lista');if(G.iniciado&&G.fila[G.i])gCliente();else gInicio();window.scrollTo(0,0);}
  else if(a==='inicio'){G.iniciado=false;gInicio();}
});

document.body.classList.add('lista');
carregar();
</script>
